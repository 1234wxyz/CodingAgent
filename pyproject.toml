[project]
name = "coding-agent"
version = "0.1.0"
description = "A minimal coding agent with LLM-backed tool use"
requires-python = ">=3.11"
dependencies = [
    "litellm",
    "pydantic",
    "tenacity",
    "tree-sitter==0.21.3",
    "tree-sitter-python==0.21.0",
    "python-dotenv",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.uv]
dev-dependencies = ["pytest"]
