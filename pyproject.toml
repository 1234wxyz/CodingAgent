[project]
name = "coding-agent"
version = "0.1.0"
description = "A minimal coding agent with LLM-backed tool use"
requires-python = ">=3.11"
dependencies = [
    "litellm",
    "pydantic",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.uv]
dev-dependencies = []
